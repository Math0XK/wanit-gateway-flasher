name: Release

# Pousser un tag vX.Y.Z (identique à __version__) construit l'exe et publie la release.
# L'utilitaire déjà installé chez les utilisateurs se met à jour à partir de cette release.
# Lancement manuel possible depuis l'onglet Actions (« Run workflow ») pour un tag déjà poussé,
# par exemple si le build ne s'est pas déclenché ou pour reconstruire une release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à construire et publier (ex. v1.0.1), déjà présent sur GitHub"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Vérifier que le tag correspond à la version
        shell: pwsh
        run: |
          $version = python -c "import wanit_flasher; print(wanit_flasher.__version__)"
          if ("v$version" -ne $env:TAG) {
            Write-Error "Le tag $env:TAG ne correspond pas à __version__ = $version"
            exit 1
          }

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3

      - name: Construire l'exe
        run: python tools/build.py

      # Exe non signé (pas de certificat de code) : les avertissements Windows sont documentés
      # dans le README et le guide d'installation.

      # Sur un relancement, la release existante est mise à jour et l'exe remplacé.
      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/WanitGatewayFlasher.exe
          generate_release_notes: true
          overwrite_files: true
