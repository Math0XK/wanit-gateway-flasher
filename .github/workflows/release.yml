name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à construire et publier (ex. v1.0.1), déjà présent sur GitHub"
        required: true
        type: string

# Le job de build n'obtient aucun droit d'écriture sur le dépôt.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Vérifier le tag et la version
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v[0-9]+(\.[0-9]+){2}$') { throw "Tag invalide : $env:TAG" }
          $version = python -c "import wanit_flasher; print(wanit_flasher.__version__)"
          if ("v$version" -ne $env:TAG) { throw "Le tag $env:TAG ne correspond pas à __version__ = $version" }

      - name: Installer les dépendances verrouillées
        run: pip install --require-hashes --no-deps -r requirements-build.lock

      - name: Construire l'exe
        run: python tools/build.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release
          path: dist/WanitGatewayFlasher.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      APP_RELEASE_PRIVATE_KEY: ${{ secrets.APP_RELEASE_PRIVATE_KEY }}
      APP_RELEASE_KEY_PASSPHRASE: ${{ secrets.APP_RELEASE_KEY_PASSPHRASE }}
    steps:
      - name: Valider le tag
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+){2}$ ]]; then
            echo "Tag invalide : $TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-release
          path: dist

      - name: Vérifier la clé de signature et créer le manifeste
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APP_RELEASE_PRIVATE_KEY"
          test -n "$APP_RELEASE_KEY_PASSPHRASE"
          python tools/create_release_manifest.py \
            --repository Math0XK/wanit-gateway-flasher \
            --tag "$TAG" \
            --asset dist/WanitGatewayFlasher.exe \
            --output dist
          key_file="$RUNNER_TEMP/app-release-private-key.pem"
          trap 'rm -f "$key_file"' EXIT
          umask 077
          printf '%s' "$APP_RELEASE_PRIVATE_KEY" > "$key_file"
          openssl dgst -sha256 -sign "$key_file" \
            -passin env:APP_RELEASE_KEY_PASSPHRASE \
            -out dist/release-manifest.sig dist/release-manifest.json

      - name: Calculer l'empreinte
        id: hash
        run: echo "sha256=$(sha256sum dist/WanitGatewayFlasher.exe | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      # Configurer l'environnement GitHub `release` avec des approbateurs requis.
      - name: Publier la release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/WanitGatewayFlasher.exe
            dist/release-manifest.json
            dist/release-manifest.sig
          generate_release_notes: true
          overwrite_files: true
          body: |
            Empreinte SHA-256 de `WanitGatewayFlasher.exe` :
            `${{ steps.hash.outputs.sha256 }}`

            Pour vérifier le fichier téléchargé (PowerShell) : `Get-FileHash .\WanitGatewayFlasher.exe`
