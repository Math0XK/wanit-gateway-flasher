name: Release

# Pousser un tag vX.Y.Z (identique à __version__) construit l'exe et publie la release.
# L'utilitaire déjà installé chez les utilisateurs se met à jour à partir de cette release.
# Lancement manuel possible depuis l'onglet Actions (« Run workflow ») pour un tag déjà poussé,
# par exemple si le build ne s'est pas déclenché ou pour reconstruire une release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à construire et publier (ex. v1.0.1), déjà présent sur GitHub"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Actions figées sur un commit précis (Dependabot propose les mises à jour)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Vérifier que le tag correspond à la version
        shell: pwsh
        run: |
          $version = python -c "import wanit_flasher; print(wanit_flasher.__version__)"
          if ("v$version" -ne $env:TAG) {
            Write-Error "Le tag $env:TAG ne correspond pas à __version__ = $version"
            exit 1
          }

      # Toutes les dépendances, y compris indirectes, sont figées et vérifiées par empreinte
      - name: Installer les dépendances
        run: pip install --require-hashes --no-deps -r requirements-build.lock

      - name: Construire l'exe
        run: python tools/build.py

      # Exe non signé (pas de certificat de code) : les avertissements Windows sont documentés
      # dans le README et le guide d'installation.

      - name: Calculer l'empreinte de l'exe
        id: hash
        shell: pwsh
        run: |
          $sha = (Get-FileHash dist/WanitGatewayFlasher.exe -Algorithm SHA256).Hash.ToLower()
          "sha256=$sha" >> $env:GITHUB_OUTPUT

      # Sur un relancement, la release existante est mise à jour et l'exe remplacé.
      - name: Publier la release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          files: dist/WanitGatewayFlasher.exe
          generate_release_notes: true
          overwrite_files: true
          body: |
            Empreinte SHA-256 de `WanitGatewayFlasher.exe` :
            `${{ steps.hash.outputs.sha256 }}`

            Pour vérifier le fichier téléchargé (PowerShell) : `Get-FileHash .\WanitGatewayFlasher.exe`
